<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>@TITLE@</title>
  <meta name="description" content="@DESCRIPTION@">
  <link rel="canonical" href="@CANONICAL@">
  <link rel="icon" type="image/png" href="/assets/web/favicon.png">
  <link rel="alternate" type="application/rss+xml" title="madeline's blog" href="/feed.xml">
@HEAD@</head>
<body>
<header>
  <hgroup>
    <h1><a href="/"><img src="/assets/web/favicon.png" width="64" height="64" alt="madeline's avatar" title="hi :3"> bitterblossom.net</a></h1>
    <p>@TAGLINE@</p>
  </hgroup>
  <nav aria-label="site">
    <menu>
@NAV@
    </menu>
  </nav>
  <search>
    <form action="https://duckduckgo.com/" method="get">
      <label for="q">search this site</label>
      <input id="q" type="search" name="q" list="titles" accesskey="s" placeholder="try a post title" required>
      <input type="hidden" name="sites" value="bitterblossom.net">
      <button type="submit">search</button>
      <kbd>s</kbd>
      <datalist id="titles">
@TITLES@
      </datalist>
    </form>
  </search>
</header>
<hr>
<main>
