<font face="Comic Sans MS, Chalkboard SE, Comic Neue, sans-serif">
  <font face="@MONO@"><button id="theme-toggle" type="button" title="toggle dark mode" hidden></button></font>
  <script>
  (function () {
    var b = document.getElementById('theme-toggle'), root = document.documentElement
    var sys = window.matchMedia && matchMedia('(prefers-color-scheme: dark)')
    var cur = function () { return root.dataset.theme || (sys && sys.matches ? 'dark' : 'light') }
    var label = function () { b.textContent = '[ ' + (cur() === 'dark' ? 'light' : 'dark') + ' ]' }
    b.onclick = function () {
      var t = cur() === 'dark' ? 'light' : 'dark'
      root.dataset.theme = t
      try { localStorage.setItem('theme', t) } catch (e) {}
      label()
    }
    if (sys && sys.addEventListener) sys.addEventListener('change', label)
    label()
    b.hidden = false
  })()
  </script>
