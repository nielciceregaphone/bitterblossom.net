<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>@TITLE@</title>
  <meta name="description" content="@DESCRIPTION@">
  <link rel="canonical" href="@CANONICAL@">
  <link rel="icon" type="image/png" href="/assets/web/favicon.png">
  <link rel="alternate" type="application/rss+xml" title="madeline's blog" href="/feed.xml">
@HEAD@</head>
<!-- marginwidth (the old html page margin, left and right) is 21px so the logo sits as far from the left edge as
     the h1 puts it from the top -->
<body marginwidth="21">
<!-- the old html way to pick a font: the whole page sits inside one <font>, closed in footer.html.
     code and pre keep their monospace because the browser sets that on them directly -->
<font face="Times New Roman, Times, serif">
<header>
@ASIDE@  <!-- the logo and the name are separate links so the underline sits under the name only, not the gap.
       align="middle" because html has no other way to centre text beside an image -->
  <h1><a href="/" tabindex="-1" aria-hidden="true"><img src="/assets/web/favicon.png" width="64" height="64" alt="" title="hi :3" align="middle"></a> <a href="/">bitterblossom.net</a></h1>
  <!-- everything under the name starts where the name does: 72px in, the 64px logo plus the 8px space after it.
       plain html has no free indent, so it's the old empty-cell table trick (a blockquote only moves 40px, and
       eats 40px on the right too). role="presentation": it's layout, not a table of data -->
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td width="72"></td><td valign="top">
    <p>@TAGLINE@</p>
    <nav aria-label="site">
      <p>@NAV@</p>
    </nav>
  </td></tr></table>
</header>
<!-- the same 72px for the page; the table closes in footer.html. the line is inside it so it's as long as the
     one above the footer -->
<table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td width="72"></td><td valign="top">
<hr>
